<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">+
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@anyblades/blades@3/css/blades.min.css"/>
    {% block head %} 
    {% endblock %}
    <title>{% block title %}{% endblock %}</title>
</head>
<body class="{% block classbody %}{% endblock %}">
    <header>
        {% block header %}
        {% endblock %}
    </header>
    <main class="container">
        {% block main %}
        {% endblock %}
    </main>
    <footer>
        {% block footer %}
        {% endblock %}
    </footer>
</body>
</html>
