description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kato", email = "losiel328@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.3",
    "fpdf2>=2.9.0",
    "jinja2>=3.1.6",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary,pool]>=3.3.8",
